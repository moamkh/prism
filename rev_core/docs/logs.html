<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Proxy Logs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #1a1a2e; color: #eee; padding: 24px; }
  h1 { margin-bottom: 12px; font-size: 22px; }
  .toolbar { margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .toolbar button, .toolbar input { padding: 6px 12px; border: none; border-radius: 4px; font-size: 13px; }
  .toolbar button { background: #27ae60; color: #fff; cursor: pointer; }
  .toolbar button:hover { background: #219150; }
  .toolbar input { background: #2a2a4e; color: #eee; border: 1px solid #444; }
  .toolbar label { font-size: 13px; color: #aaa; }
  .log-container { background: #0f0f1a; border-radius: 8px; padding: 16px; max-height: 80vh; overflow-y: auto; font-size: 13px; line-height: 1.5; }
  .log-line { padding: 2px 0; border-bottom: 1px solid #1a1a2e; white-space: pre-wrap; word-break: break-word; }
  .log-line:hover { background: #1a1a2e; }
  .level-error { color: #e74c3c; }
  .level-warn  { color: #f39c12; }
  .level-info  { color: #3498db; }
  .empty { color: #666; text-align: center; padding: 40px; }
  .meta { font-size: 12px; color: #888; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>Reverse Proxy Logs</h1>
<div class="toolbar">
  <button onclick="load()">Refresh</button>
  <button onclick="clearLogs()">Clear</button>
  <label><input type="checkbox" id="autoRefresh" checked> Auto-refresh (3s)</label>
  <input type="text" id="filter" placeholder="Filter logs..." oninput="render()">
</div>
<div class="meta" id="meta">Loading...</div>
<div class="log-container" id="container">
  <div class="empty">Loading...</div>
</div>

<script>
let allLines = [];

async function load() {
  try {
    const res = await fetch('/api/logs');
    const data = await res.json();
    allLines = data.lines || [];
    document.getElementById('meta').textContent = `Showing ${allLines.length} lines`;
    render();
  } catch (e) {
    document.getElementById('meta').textContent = 'Failed to load logs';
  }
}

function render() {
  const container = document.getElementById('container');
  const filter = document.getElementById('filter').value.toLowerCase();
  const lines = filter ? allLines.filter(l => l.toLowerCase().includes(filter)) : allLines;

  if (lines.length === 0) {
    container.innerHTML = '<div class="empty">No logs</div>';
    return;
  }

  const html = lines.map(line => {
    let cls = '';
    const lower = line.toLowerCase();
    if (lower.includes('error') || lower.includes('fatal')) cls = 'level-error';
    else if (lower.includes('warn')) cls = 'level-warn';
    else if (lower.includes('info') || lower.includes('starting') || lower.includes('ok')) cls = 'level-info';
    return `<div class="log-line ${cls}">${escapeHtml(line)}</div>`;
  }).join('');

  container.innerHTML = html;
  if (!filter) container.scrollTop = container.scrollHeight;
}

function clearLogs() {
  fetch('/api/logs', { method: 'DELETE' }).then(load);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

load();
let interval = setInterval(() => {
  if (document.getElementById('autoRefresh').checked) load();
}, 3000);
</script>
</body>
</html>
